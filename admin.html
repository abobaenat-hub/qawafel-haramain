<title>قوافل الحرمين</title>
<script>
(function () {
  const raw = decodeURIComponent((location.search || '') + ' ' + (location.hash || '')).toLowerCase();
  const routes = [
    {keys:['pilgrims','pilgrim','معتمرين','المعتمرين'], url:'pilgrims.html'},
    {keys:['employees','employee','staff','موظفين','الموظفون','الصلاحيات'], url:'employees.html'},
    {keys:['financial','finance','مالية','المالية'], url:'financial.html'},
    {keys:['archive','أرشيف','الارشيف'], url:'archive.html'},
    {keys:['agents','agent','متعهد','المتعهد','المتعهدون','وكلاء','الوكلاء'], url:'agents.html'},
    {keys:['programs','program','trips','trip','برامج','البرامج','رحلات','الرحلات'], url:'programs.html'}
  ];
  const hit = routes.find(r => r.keys.some(k => raw.includes(k)));
  location.replace(hit ? hit.url : 'index.html');
})();
</script>

<body><script>
/* V65 Audit Trail */
(function(){
  const AUDIT_KEY='qawafel_audit_session_logged_v65';
  async function audit(action, entity_type=null, entity_id=null, entity_label=null, details={}){
    try{
      if(!window.db) return;
      const {data}=await window.db.auth.getUser(); const u=data?.user; if(!u) return;
      await window.db.rpc('log_audit_event',{p_action:action,p_entity_type:entity_type,p_entity_id:entity_id,p_entity_label:entity_label,p_details:details||{},p_page:location.pathname.split('/').pop()||'index.html'});
    }catch(e){ console.debug('audit',e); }
  }
  window.qawafelAudit=audit;
  window.qawafelAuditPage=async()=>{ await audit('page_view','page',location.pathname,document.title); };
  document.addEventListener('click',function(e){
    const el=e.target.closest('button,a,.nav'); if(!el) return;
    const txt=(el.innerText||el.getAttribute('aria-label')||el.title||'').trim().replace(/\s+/g,' ').slice(0,120);
    if(!txt) return;
    const id=el.id||null;
    setTimeout(()=>audit('ui_action','ui',id,txt,{tag:el.tagName.toLowerCase(),href:el.getAttribute('href')||null}),0);
  },true);
  if(window.db){
    window.db.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN' && session?.user){
        if(!sessionStorage.getItem(AUDIT_KEY)){sessionStorage.setItem(AUDIT_KEY,'1');audit('login','auth',session.user.id,'تسجيل دخول');}
      }
    });
    setTimeout(()=>window.qawafelAuditPage(),700);
  }
})();
</script>
<script id="qawafel-audit-v169">
(function(){
  const U='https://ymjkzvdjpuuxkcgkmbtc.supabase.co';
  const K='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';
  let started=false, wrapped=false;
  const page=()=>location.pathname.split('/').pop()||'index.html';
  const safe=(v)=>String(v??'').replace(/\s+/g,' ').trim().slice(0,180);
  function start(){
    if(started||!window.supabase||!window.supabase.createClient)return false;
    started=true;
    const db=window.supabase.createClient(U,K);
    const log=(a,t=null,i=null,l=null,d={})=>db.rpc('log_audit_event',{p_action:a,p_entity_type:t,p_entity_id:i,p_entity_label:l,p_details:d,p_page:page()}).catch(()=>{});
    window.qawafelAudit=log;
    window.qawafelAuditV169=log;

    // تسجيل فتح الصفحة وتسجيل الدخول من هوية الجلسة الحقيقية.
    db.auth.getSession().then(({data})=>{
      if(data&&data.session&&data.session.user){
        log('page_view','page',page(),document.title);
        const key='qawafel_audit_login_logged_v169';
        if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');log('login','auth',data.session.user.id,'تسجيل دخول');}
      }
    }).catch(()=>{});
    db.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN'&&session&&session.user) log('login','auth',session.user.id,'تسجيل دخول');
      if(event==='SIGNED_OUT') log('logout','auth',null,'تسجيل خروج');
    });

    if(!window.__qawafelAuditV169Bound){
      window.__qawafelAuditV169Bound=true;
      document.addEventListener('click',e=>{
        const el=e.target.closest('button,a,[role="button"],input[type="submit"],input[type="button"]');
        if(!el)return;
        const txt=safe(el.innerText||el.value||el.getAttribute('aria-label')||el.title||el.id||'زر');
        if(txt) log('ui_action','ui',el.id||null,txt,{tag:el.tagName.toLowerCase(),href:el.getAttribute('href')||null});
      },true);
      document.addEventListener('submit',e=>{
        const f=e.target; if(!f)return;
        log('form_submit','form',f.id||null,safe(f.getAttribute('aria-label')||f.getAttribute('name')||f.id||'إرسال نموذج'),{action:f.getAttribute('action')||null});
      },true);
      document.addEventListener('change',e=>{
        const el=e.target; if(!el||!el.matches('select,input[type="file"],input[type="checkbox"],input[type="radio"]'))return;
        const label=el.id||el.name||el.getAttribute('aria-label')||el.type||'حقل';
        let detail={type:el.type||el.tagName.toLowerCase()};
        if(el.type==='file') detail.files=Array.from(el.files||[]).map(f=>f.name).slice(0,10);
        else if(el.type==='checkbox'||el.type==='radio') detail.checked=!!el.checked;
        else detail.value=safe(el.value);
        log(el.type==='file'?'file_select':'field_change','field',el.id||null,safe(label),detail);
      },true);
    }

    // التقاط عمليات الكتابة/التعديل الفعلية إلى Supabase، حتى لو لم يكن للزر
    // أي تسجيل يدوي داخل الصفحة. نتجاهل استدعاء سجل النشاط نفسه.
    if(!wrapped){
      wrapped=true;
      const nativeFetch=window.fetch.bind(window);
      window.fetch=async function(input,init){
        const reqUrl=typeof input==='string'?input:(input&&input.url)||'';
        const method=((init&&init.method)||((input&&input.method)||'GET')).toUpperCase();
        const isSb=reqUrl.indexOf(U)>=0;
        const isAudit=reqUrl.indexOf('/rest/v1/rpc/log_audit_event')>=0;
        const mut=isSb&&['POST','PATCH','PUT','DELETE'].includes(method)&&!isAudit;
        let resp;
        try{resp=await nativeFetch(input,init);}catch(err){throw err;}
        if(mut){
          try{
            const u=new URL(reqUrl,U);
            const parts=u.pathname.split('/').filter(Boolean);
            let op='db_operation', type=parts[1]||'supabase', label='';
            if(parts[1]==='rpc'){label=parts[2]||'rpc';}else{label=parts[1]||'table';}
            const status=resp.status;
            log(op,type,null,safe(method+' '+label),{method,url:u.pathname,status,ok:resp.ok});
          }catch(_){}
        }
        return resp;
      };
    }
    return true;
  }
  if(!start()){
    let tries=0; const timer=setInterval(()=>{if(start()||++tries>=75)clearInterval(timer)},200);
  }
})();
</script>
<script id="qawafel-permission-menu-v174">
(function(){
 const U='https://ymjkzvdjpuuxkcgkmbtc.supabase.co',K='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';
 const map={programs:'trips',pilgrims:'booking_staff',agents:'agents',supervisors:'supervisors',visa:'visa',nusuk:'nusuk',archive:'archive',financial:'finance',employees:'manager',audit:'super_admin'};
 let perms=null, busy=false;
 function pageKey(h){const x=(h||'').split('?')[0].split('#')[0].split('/').pop();return map[x]||null}
 function apply(){
   if(!perms || busy)return; busy=true;
   try{
     document.querySelectorAll('a[href]').forEach(a=>{
       const k=pageKey(a.getAttribute('href')); if(!k)return;
       let ok=perms.has(k);
       if(k==='nusuk') ok=ok||perms.has('booking_staff')||perms.has('visa');
       if(k==='supervisors') ok=ok||perms.has('supervisor')||perms.has('driver');
       if(k==='super_admin') ok=false;
       a.style.display=ok?'':'none';
       a.setAttribute('aria-hidden',ok?'false':'true');
     });
   }finally{busy=false}
 }
 async function run(){
   try{
     if(!window.supabase)return;
     const db=window.supabase.createClient(U,K);
     const r=await db.auth.getUser(),u=r.data&&r.data.user;if(!u)return;
     const q=await db.from('staff_profiles').select('role,permissions,active').eq('user_id',u.id).maybeSingle();
     const s=q.data;if(!s||s.active===false)return;
     if(['super_admin','manager'].includes(s.role)) return; // المدير والمدير العام يرون كل الأقسام
     perms=new Set([s.role,...(Array.isArray(s.permissions)?s.permissions:[])]);
     apply();
     const obs=new MutationObserver(()=>apply());
     obs.observe(document.body,{childList:true,subtree:true});
     setTimeout(()=>obs.disconnect(),15000);
     [100,300,700,1500,3000].forEach(t=>setTimeout(apply,t));
   }catch(e){console.warn('permission menu',e)}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script><script id="qawafel-permission-guard-v175">
(function(){
  const U='https://ymjkzvdjpuuxkcgkmbtc.supabase.co',K='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';
  const map={
    'programs.html':'trips','pilgrims.html':'booking_staff','agents.html':'agents','supervisors.html':'supervisors',
    'visa.html':'visa','nusuk.html':'nusuk','archive.html':'archive','financial.html':'finance','employees.html':'manager','audit.html':'super_admin'
  };
  const sensitive=Object.keys(map);
  let applied=false;
  function key(h){
    try{return new URL(h,location.href).pathname.split('/').pop().toLowerCase()}catch(e){return String(h||'').split('?')[0].split('#')[0].split('/').pop().toLowerCase()}
  }
  function hideAll(){
    document.querySelectorAll('a[href]').forEach(a=>{
      const k=key(a.getAttribute('href')); if(sensitive.includes(k)) a.style.display='none';
    });
  }
  function sectionCleanup(){
    document.querySelectorAll('#qawafelAdminDrawer .qad-section').forEach(sec=>{
      let n=sec.nextElementSibling,has=false;
      while(n && !n.classList.contains('qad-section')){if(n.matches&&n.matches('.qad-link')&&n.style.display!=='none')has=true;n=n.nextElementSibling}
      if(sec.textContent.includes('المالية')||sec.textContent.includes('العمليات')) sec.style.display=has?'':'none';
    });
  }
  async function apply(){
    try{
      if(!window.supabase){return false;}
      const db=window.supabase.createClient(U,K);
      const r=await db.auth.getUser(); const u=r.data&&r.data.user;
      if(!u){hideAll();return false;}
      const q=await db.from('staff_profiles').select('role,permissions,active').eq('user_id',u.id).maybeSingle();
      const s=q.data;
      if(!s || s.active===false){hideAll();return false;}
      if(s.role==='super_admin'||s.role==='manager'){
        document.querySelectorAll('a[href]').forEach(a=>{const k=key(a.getAttribute('href'));if(sensitive.includes(k))a.style.display='';});
        sectionCleanup(); applied=true; return true;
      }
      const perms=new Set([s.role,...(Array.isArray(s.permissions)?s.permissions:[])]);
      document.querySelectorAll('a[href]').forEach(a=>{
        const k=key(a.getAttribute('href')); const need=map[k]; if(!need)return;
        let ok=perms.has(need);
        if(k==='nusuk.html') ok=ok||perms.has('booking_staff')||perms.has('visa');
        if(k==='supervisors.html') ok=ok||perms.has('supervisor')||perms.has('driver');
        a.style.display=ok?'':'none';
        a.setAttribute('aria-hidden',ok?'false':'true');
      });
      sectionCleanup(); applied=true; return true;
    }catch(e){console.warn('permission guard',e);hideAll();return false;}
  }
  hideAll();
  let tries=0;
  const timer=setInterval(async()=>{tries++;const ok=await apply();if(ok||tries>=20){clearInterval(timer);}},500);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{hideAll();apply();});
  else {hideAll();apply();}
  const obs=new MutationObserver(()=>{if(applied)apply();});
  obs.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(()=>obs.disconnect(),20000);
})();
</script></body>
