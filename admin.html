<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قوافل الحرمين</title>
<script>
(function () {
  const raw = decodeURIComponent((location.search || '') + ' ' + (location.hash || '')).toLowerCase();
  const routes = [
    {keys:['pilgrims','pilgrim','معتمرين','المعتمرين'], url:'pilgrims.html'},
    {keys:['employees','employee','staff','موظفين','الموظفون','الصلاحيات'], url:'employees.html'},
    {keys:['financial','finance','مالية','المالية'], url:'financial.html'},
    {keys:['archive','أرشيف','الارشيف'], url:'archive.html'},
    {keys:['agents','agent','متعهد','المتعهد','المتعهدون','وكلاء','الوكلاء'], url:'agents.html'},
    {keys:['programs','program','trips','trip','برامج','البرامج','رحلات','الرحلات'], url:'programs.html'}
  ];
  const hit = routes.find(r => r.keys.some(k => raw.includes(k)));
  location.replace(hit ? hit.url : 'index.html');
})();
</script>
</head>
<body><script>
/* V65 Audit Trail */
(function(){
  const AUDIT_KEY='qawafel_audit_session_logged_v65';
  async function audit(action, entity_type=null, entity_id=null, entity_label=null, details={}){
    try{
      if(!window.db) return;
      const {data}=await window.db.auth.getUser(); const u=data?.user; if(!u) return;
      await window.db.rpc('log_audit_event',{p_action:action,p_entity_type:entity_type,p_entity_id:entity_id,p_entity_label:entity_label,p_details:details||{},p_page:location.pathname.split('/').pop()||'index.html'});
    }catch(e){ console.debug('audit',e); }
  }
  window.qawafelAudit=audit;
  window.qawafelAuditPage=async()=>{ await audit('page_view','page',location.pathname,document.title); };
  document.addEventListener('click',function(e){
    const el=e.target.closest('button,a,.nav'); if(!el) return;
    const txt=(el.innerText||el.getAttribute('aria-label')||el.title||'').trim().replace(/\s+/g,' ').slice(0,120);
    if(!txt) return;
    const id=el.id||null;
    setTimeout(()=>audit('ui_action','ui',id,txt,{tag:el.tagName.toLowerCase(),href:el.getAttribute('href')||null}),0);
  },true);
  if(window.db){
    window.db.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN' && session?.user){
        if(!sessionStorage.getItem(AUDIT_KEY)){sessionStorage.setItem(AUDIT_KEY,'1');audit('login','auth',session.user.id,'تسجيل دخول');}
      }
    });
    setTimeout(()=>window.qawafelAuditPage(),700);
  }
})();
</script>
