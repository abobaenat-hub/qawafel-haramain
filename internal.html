<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المركز الداخلي | قوافل الحرمين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0b3556;--blue:#0e4d7d;--gold:#c99a32;--bg:#f5f3ed;--line:#dce4e9;--text:#17364e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:18px 22px}
.head{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:12px}.brand b{font-size:21px}.brand small{display:block;color:#ead08d;margin-top:5px}
.wrap{max-width:1250px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 7px 25px #0000000d}
.login{max-width:450px;margin:70px auto}.hide{display:none}
label{display:block;font-weight:700;margin:10px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd8df;border-radius:10px;font:inherit}
button,.btn{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#fff}.light{background:#fff;color:var(--navy);border:1px solid #cbd8df}
.msg{padding:11px;border-radius:10px;margin:10px 0;background:#edf8f3}.err{background:#fff0f0;color:#a33}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.stat span{font-size:13px;color:#637887}.stat b{display:block;font-size:25px;margin-top:8px;color:var(--navy)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.nav a{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;text-decoration:none;color:var(--navy);font-weight:800}.nav a small{display:block;color:#71838f;font-weight:normal;margin-top:6px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}ul{margin:8px 0;padding-right:22px;line-height:2}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff2cf;font-size:12px;font-weight:800}.danger{background:#fff0f0;color:#a33}.ok{background:#e8f6ee;color:#176644}
.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th{background:#f2f6f8}
@media(max-width:850px){.grid,.nav{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:520px){.grid,.nav{grid-template-columns:1fr}}
</style>

<style><body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="logo.png" alt="قوافل الحرمين">
      <div>
        <strong>قوافل الحرمين</strong>
        <span>المركز الإداري الداخلي</span>
      </div>
    </div>
    <div class="top-actions">
      <span class="live-dot">● النظام متصل</span>
      <button id="menuBtn" class="icon-btn" aria-label="فتح القائمة">☰</button>
      <button id="logout" class="logout">تسجيل الخروج</button>
    </div>
  </div>
</header>

<div id="login" class="panel login">
  <div class="login-logo"><img src="logo.png" alt=""></div>
  <h2>تسجيل دخول الإدارة</h2>
  <p>ادخل إلى المركز الداخلي لإدارة قوافل الحرمين.</p>
  <div id="loginMsg"></div>
  <label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username">
  <label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
  <button id="loginBtn" class="primary" style="width:100%;margin-top:14px">دخول إلى النظام</button>
</div>

<div id="app" class="shell hide">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="side-title">القائمة الرئيسية</div>
      <button id="closeMenu" class="close-btn">×</button>
    </div>

    <div class="side-section">الإدارة</div>
    <a class="nav-item active" href="internal.html"><span>▦</span><div><b>الرئيسية</b><small>نظرة عامة على الشركة</small></div></a>
    <a class="nav-item" href="admin.html"><span>▤</span><div><b>إدارة البرامج</b><small>الأسعار والمقاعد والحالة</small></div></a>
    <a class="nav-item" href="pilgrims.html"><span>♙</span><div><b>إدارة المعتمرين</b><small>الملفات والحجوزات والسداد</small></div></a>
    <a class="nav-item" href="admin.html"><span>◫</span><div><b>إدارة الرحلات</b><small>متابعة الرحلات والتجهيز</small></div></a>

    <div class="side-section">المالية</div>
    <a class="nav-item" href="financial.html"><span>د.ع</span><div><b>الإدارة المالية</b><small>المقبوضات والمصروفات والأرباح</small></div></a>

    <div class="side-section">قريبًا</div>
    <div class="nav-item disabled"><span>◉</span><div><b>التقارير المتقدمة</b><small>بعد اعتماد النظام الداخلي</small></div></div>
    <div class="nav-item disabled"><span>⚙</span><div><b>إعدادات الشركة</b><small>صلاحيات المستخدمين والتهيئة</small></div></div>

    <div class="side-footer">
      <b>قوافل الحرمين</b>
      <span>النظام الداخلي — الدينار العراقي</span>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <main class="content">
    <div class="page-head">
      <div>
        <div class="eyebrow">لوحة المتابعة</div>
        <h1>مرحبًا بك في المركز الداخلي</h1>
        <p>من هنا تتابع أعمال الشركة اليومية من الرحلات إلى المعتمرين والمالية.</p>
      </div>
      <div class="date-chip" id="today"></div>
    </div>

    <section class="kpis">
      <div class="kpi"><div class="kpi-icon">▣</div><div><span>الرحلات المنشورة</span><b id="programs">0</b></div></div>
      <div class="kpi"><div class="kpi-icon">♙</div><div><span>المعتمرون</span><b id="pilgrims">0</b></div></div>
      <div class="kpi"><div class="kpi-icon">◫</div><div><span>الحجوزات</span><b id="bookings">0</b></div></div>
      <div class="kpi"><div class="kpi-icon">○</div><div><span>المقاعد المتاحة</span><b id="seats">0</b></div></div>
    </section>

    <section class="finance-strip">
      <div><span>إجمالي المبيعات</span><b id="sales">0 د.ع</b></div>
      <div><span>المقبوض</span><b id="received">0 د.ع</b></div>
      <div><span>المتبقي</span><b id="remaining">0 د.ع</b></div>
      <div><span>المصروفات</span><b id="expenses">0 د.ع</b></div>
    </section>

    <div class="main-grid">
      <section class="panel">
        <div class="section-head"><div><h2>الرحلات الحالية</h2><p>ملخص سريع للبرامج المسجلة في النظام</p></div><a href="admin.html" class="section-link">إدارة البرامج ←</a></div>
        <div id="programList" class="program-list">جاري التحميل...</div>
      </section>

      <section class="panel">
        <div class="section-head"><div><h2>يحتاج متابعة</h2><p>تنبيهات تشغيلية مهمة</p></div></div>
        <div id="alerts" class="alerts">جاري التحميل...</div>
      </section>
    </div>

    <section class="panel">
      <div class="section-head"><div><h2>آخر الحجوزات</h2><p>آخر العمليات المسجلة في النظام</p></div><a href="pilgrims.html" class="section-link">إدارة المعتمرين ←</a></div>
      <div class="table"><table><thead><tr><th>المعتمر</th><th>الرحلة</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>طريقة السداد</th></tr></thead><tbody id="bookingRows"></tbody></table></div>
    </section>
  </main>
</div>
<script>
const U='https://ymjkzvdjpuuxkcgkmbtc.supabase.co',K='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';
const db=window.supabase.createClient(U,K),$=id=>document.getElementById(id);
let B=[],P=[],PR=[],I=[],E=[];
function money(n){return Number(n||0).toLocaleString('ar-IQ')+' د.ع'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setMsg(t,e=false){$('loginMsg').className='msg'+(e?' err':'');$('loginMsg').textContent=t||''}
async function isAdmin(){
 const {data:{user}}=await db.auth.getUser(); if(!user)return null;
 const {data,error}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();
 return error||!data?null:user;
}
async function login(){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password)return setMsg('أدخل البريد وكلمة المرور.',true);
 $('loginBtn').disabled=true;setMsg('جاري التحقق...');
 try{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!await isAdmin()){await db.auth.signOut();throw Error('الحساب غير مخول للإدارة.')}$('login').classList.add('hide');$('app').classList.remove('hide');await load()}
 catch(e){setMsg(e.message||'تعذر الدخول.',true)}finally{$('loginBtn').disabled=false}
}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};

async function load(){
 const [b,p,pr,i,e]=await Promise.all([
  db.from('bookings').select('*').order('created_at',{ascending:false}),
  db.from('pilgrims').select('*'),
  db.from('programs').select('*').order('departure_date'),
  db.from('installment_plans').select('*').order('due_date'),
  db.from('expenses').select('*').order('expense_date',{ascending:false})
 ]);
 const er=[b,p,pr,i,e].find(x=>x.error);if(er){$('alerts').innerHTML='<span class="badge danger">'+esc(er.error.message)+'</span>';return}
 B=b.data||[];P=p.data||[];PR=pr.data||[];I=i.data||[];E=e.data||[];
 $('programs').textContent=PR.filter(x=>x.status==='published').length;
 $('bookings').textContent=B.length;$('pilgrims').textContent=P.length;
 $('seats').textContent=PR.reduce((s,x)=>s+Number(x.seats_available||0),0);
 const sales=B.reduce((s,x)=>s+Number(x.total_amount||0),0),rec=B.reduce((s,x)=>s+Number(x.paid_amount||0),0),exp=E.reduce((s,x)=>s+Number(x.amount||0),0);
 $('sales').textContent=money(sales);$('received').textContent=money(rec);$('remaining').textContent=money(B.reduce((s,x)=>s+Number(x.remaining_amount||0),0));$('expenses').textContent=money(exp);
 renderAlerts();renderPrograms();renderBookings();
}
function renderAlerts(){
 const today=new Date().toISOString().slice(0,10), a=[];
 const overdue=I.filter(x=>x.status!=='paid'&&x.due_date&&x.due_date<today).length;
 const visa=P.filter(x=>x.visa_status&&x.visa_status!=='issued').length;
 const docs=P.filter(x=>!x.passport_number||!x.passport_expiry).length;
 if(overdue)a.push('يوجد '+overdue+' قسط متأخر يحتاج متابعة.');
 if(visa)a.push('يوجد '+visa+' معتمرًا لم تُستكمل حالة تأشيرته.');
 if(docs)a.push('يوجد '+docs+' ملفًا ناقصًا في بيانات الجواز.');
 $('alerts').innerHTML=a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="badge ok">لا توجد تنبيهات حرجة حاليًا.</span>';
}
function renderPrograms(){
 $('programList').innerHTML=PR.map(x=>'<div style="padding:10px 0;border-bottom:1px solid #dce4e9"><b>'+esc(x.title)+'</b><br><small>'+esc(x.departure_date||'—')+' — المقاعد المتاحة: '+Number(x.seats_available||0)+' — '+esc(x.status)+'</small></div>').join('')||'لا توجد رحلات.';
}
function renderBookings(){
 $('bookingRows').innerHTML=B.slice(0,12).map(b=>{const p=P.find(x=>x.booking_id===b.id),pr=PR.find(x=>x.id===b.program_id);return '<tr><td>'+esc(p?.full_name||b.full_name)+'</td><td>'+esc(pr?.title||'—')+'</td><td>'+money(b.total_amount)+'</td><td>'+money(b.paid_amount)+'</td><td>'+money(b.remaining_amount)+'</td><td>'+(b.payment_type==='installment'?'أقساط':'نقد')+'</td></tr>'}).join('')||'<tr><td colspan="6">لا توجد حجوزات.</td></tr>';
}
(async()=>{const{data:{session}}=await db.auth.getSession();if(session&&await isAdmin()){$('login').classList.add('hide');$('app').classList.remove('hide');await load()}})();
</script>
</body></html>
