<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المعتمرون | قوافل الحرمين</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--navy:#0c3b63;--gold:#c79a3b;--cream:#f7f5ef;--line:#e2e7ea;--muted:#6b7780;--green:#16805c;--red:#a63a3a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#17364e;font-family:Tahoma,Arial,sans-serif}.top{background:#072b49;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand small{display:block;color:#e1bd72;font-size:11px;margin-top:4px}.wrap{max-width:1250px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(0,0,0,.05);margin-bottom:18px}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#fff}.ghost{background:#fff;color:var(--navy);border:1px solid #cdd7dd}.danger{background:#fff0f0;color:var(--red);border:1px solid #efcaca}.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5dfe5;border-radius:10px;font:inherit}textarea{min-height:75px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.search{max-width:400px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{background:#f4f7f9;color:var(--navy)}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:900}.ok{background:#e7f6ef;color:#116342}.pending{background:#fff2cf;color:#8a641c}.bad{background:#ffe8e8;color:#a03434}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{display:block;font-size:23px;color:var(--navy);margin-top:6px}.msg{padding:10px;border-radius:10px;margin:10px 0;font-size:13px}.msg.ok{background:#edf8f3}.msg.err{background:#fff0f0;color:#a03434}.profileHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fafafa}.item b{display:block;color:var(--navy);margin-bottom:5px}.money{font-size:25px;font-weight:900;color:var(--gold)}.sectionTitle{color:var(--navy);margin:22px 0 10px}.installments{width:100%;border-collapse:collapse}.installments td,.installments th{padding:9px}.login{max-width:430px;margin:70px auto}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:900px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.profileGrid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.formgrid,.profileGrid,.cards{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body>
<div class="top"><div class="brand">قوافل الحرمين<small>إدارة ملفات المعتمرين</small></div><div><a href="admin.html" class="btn ghost">لوحة الإدارة</a> <button class="btn ghost" onclick="logout()">خروج</button></div></div>
<div id="login" class="panel login"><h2>دخول الإدارة</h2><div id="loginMsg"></div><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة المرور</label><input id="password" type="password"><br><br><button class="btn primary" style="width:100%" onclick="signIn()">دخول</button></div>
<div id="app" class="wrap hidden"><div class="cards"><div class="stat">المعتمرون<b id="countPilgrims">0</b></div><div class="stat">الحجوزات<b id="countBookings">0</b></div><div class="stat">المدفوع<b id="sumPaid">0</b></div><div class="stat">المتبقي<b id="sumRemaining">0</b></div></div>
<div class="grid"><div class="panel"><div class="toolbar"><h2 id="formTitle">إضافة معتمر جديد</h2><button class="btn ghost" onclick="resetForm()">جديد</button></div><div id="formMsg"></div><form id="form"><input id="id" type="hidden"><label>الاسم الكامل *</label><input id="full_name" required><div class="formgrid"><div><label>الهاتف</label><input id="phone"></div><div><label>الجنسية</label><input id="nationality" value="عراقي"></div><div><label>تاريخ الميلاد</label><input id="birth_date" type="date"></div><div><label>الجنس</label><select id="gender"><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div><div><label>رقم الجواز</label><input id="passport_number"></div><div><label>انتهاء الجواز</label><input id="passport_expiry" type="date"></div></div><label>رابط/مسار نسخة الجواز</label><input id="document_url" placeholder="يضاف بعد رفع الملف إلى التخزين"><label>حالة الفيزا</label><select id="visa_status"><option value="قيد الإجراء">قيد الإجراء</option><option value="صادرة">صادرة</option><option value="مرفوضة">مرفوضة</option></select><div class="formgrid"><div><label>رقم الفيزا</label><input id="visa_number"></div><div><label>تاريخ إصدار الفيزا</label><input id="visa_issued_at" type="date"></div></div><label>ملاحظات الفيزا</label><textarea id="visa_notes"></textarea><label>ملاحظات عامة</label><textarea id="notes"></textarea><br><button class="btn primary" type="submit">حفظ بيانات المعتمر</button></form></div>
<div class="panel"><div class="toolbar"><div><h2>قائمة المعتمرين</h2><p style="color:var(--muted)">ابحث بالاسم أو الهاتف أو الجواز.</p></div><input class="search" id="search" placeholder="بحث..." oninput="renderList()"></div><div id="listMsg"></div><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الجواز</th><th>الفيزا</th><th>الملف</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div id="profile" class="panel hidden"></div></div>
<script>
const URL='https://ymjkzvdjpuuxkcgkmbtc.supabase.co',KEY='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ',db=window.supabase.createClient(URL,KEY);let pilgrims=[],bookings=[],programs=[];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-IQ')+' د.ع';
function msg(id,text,type='ok'){ $(id).innerHTML=text?`<div class="msg ${type==='ok'?'ok':'err'}">${esc(text)}</div>`:'' }
async function authorized(){const{data:userData}=await db.auth.getUser();if(!userData.user)return false;const{data}=await db.from('admin_users').select('role').eq('user_id',userData.user.id).maybeSingle();return !!data}
async function signIn(){msg('loginMsg','جاري الدخول...');const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg('loginMsg',error.message,'err');if(!(await authorized())){await logout();return msg('loginMsg','هذا الحساب غير مخول للإدارة.','err')}$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadAll()}
async function logout(){await db.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function loadAll(){const [p,b,pr]=await Promise.all([db.from('pilgrims').select('*').order('created_at',{ascending:false}),db.from('bookings').select('*').order('created_at',{ascending:false}),db.from('programs').select('*').order('departure_date')]);if(p.error||b.error||pr.error){msg('listMsg',(p.error||b.error||pr.error).message,'err');return}pilgrims=p.data||[];bookings=b.data||[];programs=pr.data||[];renderList();$('countPilgrims').textContent=pilgrims.length;$('countBookings').textContent=bookings.length;$('sumPaid').textContent=money(bookings.reduce((a,x)=>a+Number(x.paid_amount||0),0));$('sumRemaining').textContent=money(bookings.reduce((a,x)=>a+Number(x.remaining_amount||0),0))}
function renderList(){const q=($('search').value||'').trim().toLowerCase();const list=pilgrims.filter(p=>[p.full_name,p.phone,p.passport_number,p.profile_code].some(v=>String(v||'').toLowerCase().includes(q)));$('rows').innerHTML=list.map(p=>`<tr><td><b>${esc(p.full_name)}</b><br><small>${esc(p.profile_code||'')}</small></td><td>${esc(p.phone||'—')}</td><td>${esc(p.passport_number||'—')}</td><td><span class="badge ${p.visa_status==='صادرة'?'ok':p.visa_status==='مرفوضة'?'bad':'pending'}">${esc(p.visa_status)}</span></td><td><button class="btn primary" onclick="openProfile('${p.id}')">فتح الملف</button></td></tr>`).join('')||'<tr><td colspan="5">لا يوجد معتمرون.</td></tr>'}
function resetForm(){ $('form').reset();$('id').value='';$('nationality').value='عراقي';$('visa_status').value='قيد الإجراء';$('formTitle').textContent='إضافة معتمر جديد';msg('formMsg','') }
function fill(p){for(const k of ['id','full_name','phone','nationality','birth_date','gender','passport_number','passport_expiry','document_url','visa_status','visa_number','visa_issued_at','visa_notes','notes'])$(k).value=p[k]??'';$('formTitle').textContent='تعديل بيانات المعتمر';window.scrollTo({top:0,behavior:'smooth'})}
$('form').onsubmit=async e=>{e.preventDefault();msg('formMsg','جاري الحفظ...');const id=$('id').value;const payload={full_name:$('full_name').value.trim(),phone:$('phone').value.trim()||null,nationality:$('nationality').value.trim()||null,birth_date:$('birth_date').value||null,gender:$('gender').value,passport_number:$('passport_number').value.trim()||null,passport_expiry:$('passport_expiry').value||null,document_url:$('document_url').value.trim()||null,visa_status:$('visa_status').value,visa_number:$('visa_number').value.trim()||null,visa_issued_at:$('visa_issued_at').value||null,visa_notes:$('visa_notes').value.trim()||null,notes:$('notes').value.trim()||null};const r=id?await db.from('pilgrims').update(payload).eq('id',id):await db.from('pilgrims').insert(payload);if(r.error)return msg('formMsg',r.error.message,'err');msg('formMsg','تم حفظ ملف المعتمر');resetForm();loadAll()}
async function openProfile(id){const p=pilgrims.find(x=>x.id===id);if(!p)return;const b=bookings.filter(x=>true);const booking=b.find(x=>x.id===p.booking_id);let inst=[];let pays=[];if(booking){const [i,pa]=await Promise.all([db.from('installment_plans').select('*').eq('booking_id',booking.id).order('installment_number'),db.from('payments').select('*').eq('booking_id',booking.id).order('payment_date',{ascending:false})]);inst=i.data||[];pays=pa.data||[]}const prog=booking?programs.find(x=>x.id===booking.program_id):null;$('profile').classList.remove('hidden');$('profile').innerHTML=`<div class="profileHead"><div><h2>${esc(p.full_name)}</h2><p style="color:var(--muted)">رمز الملف: <b>${esc(p.profile_code||'—')}</b></p></div><div class="actions"><button class="btn gold" onclick='fill(${JSON.stringify(p)})'>تعديل</button><button class="btn ghost" onclick="window.print()">طباعة الملف</button></div></div><div class="profileGrid"><div class="item"><b>📱 الهاتف</b>${esc(p.phone||'—')}</div><div class="item"><b>🛂 رقم الجواز</b>${esc(p.passport_number||'—')}</div><div class="item"><b>📅 انتهاء الجواز</b>${esc(p.passport_expiry||'—')}</div><div class="item"><b>🛫 حالة الفيزا</b><span class="badge ${p.visa_status==='صادرة'?'ok':p.visa_status==='مرفوضة'?'bad':'pending'}">${esc(p.visa_status)}</span></div><div class="item"><b>رقم الفيزا</b>${esc(p.visa_number||'—')}</div><div class="item"><b>تاريخ الإصدار</b>${esc(p.visa_issued_at||'—')}</div></div><h3 class="sectionTitle">🚌 الرحلة والحجز</h3><div class="item">${booking?`رقم الحجز: <b>${esc(booking.booking_number||'—')}</b><br>البرنامج: ${esc(prog?.title||'—')}<br>إجمالي: <span class="money">${money(booking.total_amount)}</span> — المدفوع: <b>${money(booking.paid_amount)}</b> — المتبقي: <b>${money(booking.remaining_amount)}</b>`:'لا يوجد حجز مرتبط بهذا الملف حاليًا.'}</div><h3 class="sectionTitle">📅 الأقساط</h3><div class="tablewrap"><table class="installments"><thead><tr><th>القسط</th><th>الاستحقاق</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>${inst.map(x=>`<tr><td>${x.installment_number}</td><td>${x.due_date||'—'}</td><td>${money(x.amount)}</td><td>${money(x.paid_amount)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد أقساط مسجلة.</td></tr>'}</tbody></table></div><h3 class="sectionTitle">🧾 سجل الدفعات</h3><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>المرجع</th></tr></thead><tbody>${pays.map(x=>`<tr><td>${new Date(x.payment_date).toLocaleDateString('ar-IQ')}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'—')}</td><td>${esc(x.reference||'—')}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد دفعات.</td></tr>'}</tbody></table></div><h3 class="sectionTitle">📎 المستمسكات</h3><div class="item">نسخة الجواز: ${p.document_url?`<a href="${esc(p.document_url)}" target="_blank">فتح المستند</a>`:'لم تُرفع بعد'}</div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
(async()=>{const{data:{session}}=await db.auth.getSession();if(session&&await authorized()){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}})();
</script></body></html>
