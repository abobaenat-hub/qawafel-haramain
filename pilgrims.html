<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة المعتمرين | قوافل الحرمين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f7f5ef;color:#17364e;font-family:Tahoma,Arial}
.top{background:#072b49;color:#fff;padding:18px 20px}.top b{font-size:22px}.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #dfe6ea;border-radius:18px;padding:22px;margin-top:30px;box-shadow:0 8px 25px #0001}
input{width:100%;padding:13px;border:1px solid #ccd7df;border-radius:10px;font:inherit;box-sizing:border-box;margin:7px 0 14px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#0c3b63;color:#fff;font:inherit;font-weight:bold}
.msg{padding:12px;border-radius:10px;margin:12px 0;background:#edf8f3}.err{background:#fff0f0;color:#a33}
.hide{display:none}.ok{color:#176644}
</style>
</head>
<body>
<div class="top"><b>قوافل الحرمين</b><div>إدارة ملفات المعتمرين</div></div>

<div id="loginBox" class="wrap">
<div class="card">
<h2>دخول الإدارة</h2>
<div id="msg"></div>
<label>البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username">
<label>كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" type="button">دخول</button>
</div>
</div>

<div id="app" class="wrap hide">
<div class="card">
<h2>تم تسجيل الدخول بنجاح ✅</h2>
<p class="ok">حسابك مصنف كمدير في النظام.</p>
<p id="userInfo"></p>
<button id="logoutBtn" type="button">خروج</button>
</div>
</div>

<script>
(function(){
'use strict';

const SUPABASE_URL='https://ymjkzvdjpuuxkcgkmbtc.supabase.co';
const SUPABASE_KEY='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';

function show(text,error){
  const box=document.getElementById('msg');
  box.className='msg'+(error?' err':'');
  box.textContent=text||'';
}
function showApp(user){
  document.getElementById('loginBox').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('userInfo').textContent='الحساب: '+(user.email||'');
}

window.addEventListener('DOMContentLoaded', function(){
  const btn=document.getElementById('loginBtn');
  const pass=document.getElementById('password');
  const email=document.getElementById('email');

  let client;
  try{
    if(!window.supabase) throw new Error('تعذر تحميل مكتبة الاتصال. أعد تحميل الصفحة.');
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  }catch(e){
    show(e.message||'تعذر تشغيل النظام.',true);
    return;
  }

  async function doLogin(){
    const em=email.value.trim(), pw=pass.value;
    if(!em||!pw){show('أدخل البريد الإلكتروني وكلمة المرور.',true);return;}
    btn.disabled=true;
    btn.textContent='جاري التحقق...';
    show('جاري التحقق من الحساب...');
    try{
      const result=await client.auth.signInWithPassword({email:em,password:pw});
      if(result.error) throw result.error;
      const user=result.data && result.data.user;
      if(!user) throw new Error('لم يتم العثور على بيانات الحساب.');

      const admin=await client.from('admin_users').select('user_id,role').eq('user_id',user.id).maybeSingle();
      if(admin.error) throw admin.error;
      if(!admin.data) {
        await client.auth.signOut();
        throw new Error('الحساب موجود، لكنه غير مضاف كمدير.');
      }

      show('تم تسجيل الدخول بنجاح ✅');
      showApp(user);
    }catch(e){
      show(e && e.message ? e.message : 'تعذر تسجيل الدخول.',true);
    }finally{
      btn.disabled=false;
      btn.textContent='دخول';
    }
  }

  btn.addEventListener('click',doLogin);
  pass.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  email.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

  document.getElementById('logoutBtn').addEventListener('click',async()=>{
    await client.auth.signOut();
    location.reload();
  });

  client.auth.getSession().then(async({data})=>{
    if(data.session){
      const user=data.session.user;
      const admin=await client.from('admin_users').select('user_id,role').eq('user_id',user.id).maybeSingle();
      if(admin.data) showApp(user);
    }
  }).catch(e=>show(e.message||'تعذر فحص الجلسة.',true));
});
})();
</script>
</body>
</html>
