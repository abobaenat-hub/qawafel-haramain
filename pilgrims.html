<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المعتمرون | قوافل الحرمين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#0c3b63;--d:#072b49;--g:#c79a3b;--c:#f7f5ef;--l:#dfe6ea;--r:#a33;--ok:#176644}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:#17364e;font-family:Tahoma,Arial}
.top{background:var(--d);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top small{display:block;color:#e1bd72;margin-top:4px}.wrap{max-width:1250px;margin:auto;padding:18px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.p{background:var(--n);color:#fff}.w{background:#fff;color:var(--n);border:1px solid #ccd7df}
.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 25px #0000000b}
.login{max-width:460px;margin:70px auto}label{display:block;font-weight:800;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd7df;border-radius:10px;font:inherit}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:11px;border-radius:10px;margin:10px 0;background:#edf8f3}.err{background:#fff0f0;color:var(--r)}
.hide{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px}.stat b{display:block;font-size:22px;color:var(--n);margin-top:5px}
.table{overflow:auto}table{width:100%;min-width:780px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:right}th{background:#f2f6f8;color:var(--n)}
.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800;background:#fff2cf}.ok{background:#e7f6ef;color:#176644}.danger{background:#fff0f0;color:#a33}
.profileHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.money{font-weight:900;color:var(--n)}.section{border-top:1px solid var(--l);padding-top:15px;margin-top:15px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.cols,.stats{grid-template-columns:1fr}.top{align-items:flex-start}.top .actions{display:flex;flex-direction:column}}
@media print{.top,#login,.noPrint,#app>.stats,#app>.grid{display:none!important}.wrap{max-width:none;padding:0}.panel{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="top">
 <div><b>قوافل الحرمين</b><small>إدارة ملفات المعتمرين</small></div>
 <div class="actions"><a class="btn w" href="admin.html">لوحة الإدارة</a> <button class="btn w noPrint" id="logout">خروج</button></div>
</div>

<div id="login" class="panel login">
<h2>دخول الإدارة</h2><div id="loginMsg"></div>
<label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username">
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
<br><button id="loginBtn" class="btn p" style="width:100%">دخول</button>
</div>

<main id="app" class="wrap hide">
<div class="stats">
 <div class="stat">المعتمرون<b id="pc">0</b></div>
 <div class="stat">الحجوزات<b id="bc">0</b></div>
 <div class="stat">المدفوع<b id="paid">0</b></div>
 <div class="stat">المتبقي<b id="rem">0</b></div>
</div>

<div class="grid">
<section class="panel">
<h2>إضافة معتمر</h2><div id="formMsg"></div>
<form id="form">
<label>الاسم الكامل *</label><input id="name" required>
<label>البرنامج *</label><select id="program" required><option value="">جاري التحميل...</option></select>
<div class="cols">
<div><label>الهاتف</label><input id="phone"></div>
<div><label>الجنسية</label><input id="nat" value="عراقي"></div>
<div><label>رقم الجواز</label><input id="pass"></div>
<div><label>انتهاء الجواز</label><input id="pex" type="date"></div>
<div><label>حالة الفيزا</label><select id="visa"><option>قيد الإجراء</option><option>صادرة</option><option>مرفوضة</option></select></div>
<div><label>رقم الفيزا</label><input id="vnum"></div>
<div><label>تاريخ إصدار الفيزا</label><input id="vdate" type="date"></div>
<div><label>الدفعة الأولى</label><input id="initial" type="number" min="0" value="0"></div>
<div><label>أول استحقاق قسط</label><input id="due" type="date"></div>
</div>
<label>رابط نسخة الجواز</label><input id="doc" placeholder="يمكن إضافة رابط الملف لاحقًا">
<label>ملاحظات</label><textarea id="notes"></textarea>
<br><button class="btn p" type="submit">حفظ المعتمر والحجز</button>
</form>
</section>

<section class="panel">
<h2>قائمة المعتمرين</h2>
<input id="search" placeholder="بحث بالاسم أو الهاتف أو الجواز أو رمز الملف">
<div id="listMsg"></div>
<div class="table"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الجواز</th><th>الفيزا</th><th>الرحلة</th><th>الحساب</th><th>الملف</th></tr></thead>
<tbody id="rows"></tbody></table></div>
</section>
</div>

<section id="profile" class="panel hide"></section>
</main>

<script>
(function(){
'use strict';
const U='https://ymjkzvdjpuuxkcgkmbtc.supabase.co';
const K='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';
const db=window.supabase.createClient(U,K);
const $=id=>document.getElementById(id);
let P=[],B=[],PR=[],I=[];

function msg(id,text,error){
 const el=$(id); if(!el)return;
 el.className='msg'+(error?' err':''); el.textContent=text||'';
}
function money(n){return Number(n||0).toLocaleString('ar-IQ')+' د.ع'}
function statusBadge(s){
 const good=['paid','صادرة','مدفوع','مكتمل'].includes(String(s||''));
 return '<span class="badge '+(good?'ok':'')+'">'+(s||'قيد الإجراء')+'</span>';
}
async function isAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return null;
 const {data,error}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();
 if(error||!data)return null;
 return user;
}
function showApp(user){
 $('login').classList.add('hide'); $('app').classList.remove('hide');
 load();
}
async function doLogin(){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password)return msg('loginMsg','أدخل البريد الإلكتروني وكلمة المرور.',true);
 $('loginBtn').disabled=true; msg('loginMsg','جاري التحقق...');
 try{
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(!data.user)throw Error('لم يتم العثور على بيانات الحساب.');
   const admin=await isAdmin();
   if(!admin){await db.auth.signOut();throw Error('هذا الحساب غير مخول للإدارة.');}
   showApp(admin); msg('loginMsg','تم الدخول بنجاح');
 }catch(e){msg('loginMsg',e.message||'تعذر تسجيل الدخول.',true)}
 finally{$('loginBtn').disabled=false}
}
$('loginBtn').onclick=doLogin;
$('password').onkeydown=e=>{if(e.key==='Enter')doLogin()};
$('email').onkeydown=e=>{if(e.key==='Enter')doLogin()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};

async function load(){
 msg('listMsg','جاري تحميل البيانات...');
 const [a,b,c,i]=await Promise.all([
  db.from('pilgrims').select('*').order('created_at',{ascending:false}),
  db.from('bookings').select('*').order('created_at',{ascending:false}),
  db.from('programs').select('*').order('departure_date'),
  db.from('installment_plans').select('*').order('due_date')
 ]);
 const er=[a,b,c,i].find(x=>x.error);
 if(er)return msg('listMsg',er.error.message,true);
 P=a.data||[];B=b.data||[];PR=c.data||[];I=i.data||[];
 $('pc').textContent=P.length;$('bc').textContent=B.length;
 $('paid').textContent=money(B.reduce((s,x)=>s+Number(x.paid_amount||0),0));
 $('rem').textContent=money(B.reduce((s,x)=>s+Number(x.remaining_amount||0),0));
 $('program').innerHTML='<option value="">اختر البرنامج</option>'+PR.filter(x=>x.status==='published').map(x=>'<option value="'+x.id+'">'+esc(x.title)+' — '+money(x.price)+'</option>').join('');
 render();msg('listMsg','');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 const q=$('search').value.trim().toLowerCase();
 $('rows').innerHTML=P.filter(x=>[x.full_name,x.phone,x.passport_number,x.profile_code].some(v=>String(v||'').toLowerCase().includes(q))).map(x=>{
  const b=B.find(z=>z.id===x.booking_id),pr=PR.find(z=>z.id===b?.program_id);
  return '<tr><td><b>'+esc(x.full_name)+'</b><br><small>'+esc(x.profile_code)+'</small></td>'+
  '<td>'+esc(x.phone||'—')+'</td><td>'+esc(x.passport_number||'—')+'</td><td>'+statusBadge(x.visa_status)+'</td>'+
  '<td>'+esc(pr?.title||'—')+'</td><td>'+money(b?.paid_amount)+' / '+money(b?.remaining_amount)+'</td>'+
  '<td><button class="btn p" onclick="window.openProfile(\''+x.id+'\')">فتح</button></td></tr>'
 }).join('')||'<tr><td colspan="7">لا يوجد معتمرون.</td></tr>';
}
$('search').oninput=render;

window.openProfile=async function(id){
 const p=P.find(x=>x.id===id); if(!p)return;
 const b=B.find(x=>x.id===p.booking_id),pr=PR.find(x=>x.id===b?.program_id);
 const ins=I.filter(x=>x.booking_id===b?.id);
 const paid=Number(b?.paid_amount||0),remaining=Number(b?.remaining_amount||0);
 $('profile').classList.remove('hide');
 $('profile').innerHTML=
 '<div class="profileHead"><div><h2>ملف المعتمر</h2><small>'+esc(p.profile_code||'')+'</small></div><div class="noPrint"><button class="btn w" onclick="window.print()">طباعة الملف</button></div></div>'+
 '<div class="cols"><div><b>الاسم</b><br>'+esc(p.full_name)+'</div><div><b>الهاتف</b><br>'+esc(p.phone||'—')+'</div>'+
 '<div><b>الجنسية</b><br>'+esc(p.nationality||'—')+'</div><div><b>رقم الجواز</b><br>'+esc(p.passport_number||'—')+'</div>'+
 '<div><b>انتهاء الجواز</b><br>'+esc(p.passport_expiry||'—')+'</div><div><b>نسخة الجواز</b><br>'+(p.document_url?'<a href="'+esc(p.document_url)+'" target="_blank">فتح النسخة</a>':'—')+'</div></div>'+
 '<div class="section"><h3>الفيزا</h3><div class="cols"><div>الحالة: '+statusBadge(p.visa_status)+'</div><div>الرقم: '+esc(p.visa_number||'—')+'</div><div>تاريخ الإصدار: '+esc(p.visa_issued_at||'—')+'</div></div></div>'+
 '<div class="section"><h3>الرحلة والحساب</h3><div class="cols"><div>البرنامج: <b>'+esc(pr?.title||'—')+'</b></div><div>التاريخ: '+esc(pr?.departure_date||'—')+'</div><div>الإجمالي: <span class="money">'+money(b?.total_amount)+'</span></div><div>المدفوع: <span class="money">'+money(paid)+'</span></div><div>المتبقي: <span class="money">'+money(remaining)+'</span></div><div>الحالة: '+statusBadge(b?.status)+'</div></div></div>'+
 '<div class="section"><h3>جدول الأقساط</h3>'+
 (ins.length?'<div class="table"><table><thead><tr><th>القسط</th><th>الاستحقاق</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>'+
 ins.map(x=>'<tr><td>'+esc(x.installment_number)+'</td><td>'+esc(x.due_date||'—')+'</td><td>'+money(x.amount)+'</td><td>'+money(x.paid_amount)+'</td><td>'+statusBadge(x.status)+'</td></tr>').join('')+
 '</tbody></table></div>':'لا توجد أقساط مسجلة.')+'</div>'+
 '<div class="section"><h3>سجل الدفعات</h3><div id="paymentsBox">جاري التحميل...</div></div>'+
 '<div class="section"><b>ملاحظات:</b><br>'+esc(p.notes||'—')+'</div>';
 $('paymentsBox').innerHTML='جاري التحميل...';
 if(b?.id){
  const {data,error}=await db.from('payments').select('*').eq('booking_id',b.id).order('payment_date',{ascending:false});
  if(error)$('paymentsBox').innerHTML='<span class="danger">'+esc(error.message)+'</span>';
  else $('paymentsBox').innerHTML=data?.length?'<div class="table"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظات</th></tr></thead><tbody>'+
   data.map(x=>'<tr><td>'+esc(x.payment_date||x.created_at||'—')+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.method||'—')+'</td><td>'+esc(x.notes||'—')+'</td></tr>').join('')+'</tbody></table></div>':'لا توجد دفعات مسجلة.';
 }
 $('profile').scrollIntoView({behavior:'smooth'});
};

$('form').onsubmit=async e=>{
 e.preventDefault();msg('formMsg','جاري الحفظ...');
 const pr=PR.find(x=>x.id===$('program').value);
 if(!pr)return msg('formMsg','اختر البرنامج أولًا.',true);
 const total=Number(pr.price||0),initial=Math.max(Number($('initial').value||0),0);
 const paid=Math.min(initial,total),remaining=total-paid;
 try{
  const booking={program_id:pr.id,full_name:$('name').value.trim(),phone:$('phone').value.trim()||'',passengers_count:1,total_amount:total,paid_amount:paid,status:remaining?'pending':'paid',notes:'حجز من إدارة المعتمرين'};
  const br=await db.from('bookings').insert(booking).select('id').single();
  if(br.error)throw br.error;
  const payload={booking_id:br.data.id,full_name:$('name').value.trim(),phone:$('phone').value.trim()||null,nationality:$('nat').value.trim()||'عراقي',passport_number:$('pass').value.trim()||null,passport_expiry:$('pex').value||null,visa_status:$('visa').value,visa_number:$('vnum').value.trim()||null,visa_issued_at:$('vdate').value||null,document_url:$('doc').value.trim()||null,notes:$('notes').value.trim()||null,profile_code:'QH-'+Date.now().toString().slice(-8)};
  const prr=await db.from('pilgrims').insert(payload);
  if(prr.error){await db.from('bookings').delete().eq('id',br.data.id);throw prr.error}
  if(paid>0){
   const pay=await db.from('payments').insert({booking_id:br.data.id,amount:paid,payment_date:new Date().toISOString().slice(0,10),method:'دفعة أولى',notes:'دفعة أولى عند إنشاء الحجز'});
   if(pay.error)console.warn(pay.error);
  }
  if(remaining&&$('due').value){
   const ins=await db.from('installment_plans').insert({booking_id:br.data.id,installment_number:1,due_date:$('due').value,amount:remaining,paid_amount:0,status:'pending'});
   if(ins.error)console.warn(ins.error);
  }
  msg('formMsg','تم إنشاء ملف المعتمر والحجز بنجاح ✅');
  e.target.reset();$('nat').value='عراقي';$('initial').value=0;await load();
 }catch(err){msg('formMsg',err.message||'تعذر الحفظ.',true)}
};

(async()=>{
 try{
  const {data:{session}}=await db.auth.getSession();
  if(session){const user=await isAdmin();if(user)showApp(user)}
 }catch(e){msg('loginMsg',e.message||'تعذر فحص الجلسة.',true)}
})();
})();
</script>
</body>
</html>
