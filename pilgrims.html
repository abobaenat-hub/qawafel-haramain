<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المعتمرون | قوافل الحرمين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#0c3b63;--d:#072b49;--g:#c79a3b;--c:#f7f5ef;--l:#dfe6ea;--r:#a33}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:#17364e;font-family:Tahoma,Arial}
.top{background:var(--d);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;color:#e1bd72;margin-top:4px}.wrap{max-width:1200px;margin:auto;padding:18px}
.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 25px #0000000b}
.login{max-width:460px;margin:70px auto}label{display:block;font-weight:800;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd7df;border-radius:10px;font:inherit}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.p{background:var(--n);color:#fff}.w{background:#fff;color:var(--n);border:1px solid #ccd7df}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px}.stat b{display:block;font-size:22px;color:var(--n);margin-top:5px}
.msg{padding:11px;border-radius:10px;margin:10px 0;background:#edf8f3}.err{background:#fff0f0;color:var(--r)}
.hide{display:none}.table{overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:right}th{background:#f2f6f8;color:var(--n)}
.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800;background:#fff2cf}.ok{background:#e7f6ef;color:#176644}
.section{border-top:1px solid var(--l);padding-top:15px;margin-top:15px}.money{font-weight:900;color:var(--n)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.cols,.stats{grid-template-columns:1fr}}
@media print{.top,#login,.noPrint,#app>.stats,#app>.grid{display:none!important}.panel{box-shadow:none;border:0}}

.badge-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.badge-tools select{max-width:360px}.photo-preview{width:90px;height:110px;border:1px dashed #b9c7d0;border-radius:10px;object-fit:cover;background:#f5f7f8;display:block;margin-top:7px}.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm;padding:8mm}.print-badge{width:90mm;height:60mm;border:1px solid #d8dde2;border-radius:4mm;background:#fff;position:relative;overflow:hidden;padding:5mm;box-shadow:0 2px 8px #0001;page-break-inside:avoid}.print-badge .btop{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9bd75;padding-bottom:2.5mm;margin-bottom:2.5mm}.print-badge .logo-text{font-weight:900;color:#0c3b63;font-size:4mm}.print-badge .sub{font-size:2.2mm;color:#8b6b25;margin-top:1mm}.print-badge .body{display:grid;grid-template-columns:25mm 1fr 17mm;gap:3mm;align-items:center}.print-badge .photo{width:25mm;height:31mm;border-radius:2mm;object-fit:cover;border:1px solid #ccd7df}.print-badge .name{font-weight:900;font-size:4.2mm;color:#072b49;margin-bottom:2mm}.print-badge .line{font-size:2.6mm;margin:1.2mm 0;color:#36566a}.print-badge .line b{color:#0c3b63}.print-badge .qr{width:17mm;height:17mm}.print-badge .foot{position:absolute;bottom:0;right:0;left:0;background:#072b49;color:#fff;font-size:2.3mm;padding:2mm 4mm;display:flex;justify-content:space-between}.print-only{display:none}@media print{body.printing-badges>*{display:none!important}.print-only{display:block!important}.badge-grid{padding:8mm}.print-badge{box-shadow:none}}
</style>
</head>
<body>
<div class="top">
<div><b>قوافل الحرمين</b><small>إدارة ملفات المعتمرين</small></div>
<div><a class="btn w" href="admin.html">لوحة الإدارة</a> <button id="logout" class="btn w noPrint">خروج</button></div>
</div>

<div id="login" class="panel login">
<h2>دخول الإدارة</h2><div id="loginMsg"></div>
<label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username">
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
<br><button id="loginBtn" class="btn p" style="width:100%">دخول</button>
</div>

<main id="app" class="wrap hide">
<div class="stats">
<div class="stat">المعتمرون<b id="pc">0</b></div>
<div class="stat">الحجوزات<b id="bc">0</b></div>
<div class="stat">المدفوع<b id="paid">0</b></div>
<div class="stat">المتبقي<b id="rem">0</b></div>
</div>

<div class="grid">
<section class="panel">
<h2>إضافة معتمر</h2><div id="formMsg"></div>
<form id="form">
<label>الاسم الكامل *</label><input id="name" required>
<label>البرنامج *</label><select id="program" required><option value="">جاري التحميل...</option></select>
<label>نوع البرنامج *</label><select id="paymentType" required><option value="cash">نقد</option><option value="installment">قسط</option></select>
<div class="cols">
<div><label>الهاتف</label><input id="phone"></div>
<div><label>الجنسية</label><input id="nat" value="عراقي"></div>
<div><label>رقم الجواز</label><input id="pass"></div>
<div><label>انتهاء الجواز</label><input id="pex" type="date"></div>
<div><label>صورة المعتمر</label><input id="photo" type="file" accept="image/*" capture="user"><img id="photoPreview" class="photo-preview hide" alt="معاينة الصورة"></div>
<div><label>حالة الفيزا</label><select id="visa"><option>قيد الإجراء</option><option>صادرة</option><option>مرفوضة</option></select></div>
<div><label>رقم الفيزا</label><input id="vnum"></div>
<div><label>تاريخ إصدار الفيزا</label><input id="vdate" type="date"></div>
<div><label>الدفعة الأولى</label><input id="initial" type="number" min="0" value="0"></div>
<div id="dueWrap"><label>عدد الأقساط</label><select id="installmentCount"><option value="1">قسط واحد</option><option value="2">قسطان</option><option value="3">3 أقساط</option><option value="4">4 أقساط</option><option value="5">5 أقساط</option><option value="6">6 أقساط</option><option value="12">12 قسطًا</option></select></div>
</div>
<div id="scheduleWrap" class="hide section"><h3>جدول الأقساط</h3><div id="schedule"></div></div>
<label>رابط نسخة الجواز</label><input id="doc">
<label>ملاحظات</label><textarea id="notes"></textarea>
<br><button class="btn p" type="submit">حفظ المعتمر والحجز</button>
</form>
</section>

<section class="panel">
<h2>قائمة المعتمرين</h2><div class="badge-tools noPrint"><select id="badgeProgram"><option value="">اختر الرحلة لطباعة الباجات</option></select><button id="printTripBadges" class="btn p">🎫 طباعة باجات الرحلة كاملة</button></div><input id="search" placeholder="بحث بالاسم أو الهاتف أو الجواز أو رمز الملف">
<div id="listMsg"></div>
<div class="table"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الجواز</th><th>الفيزا</th><th>البرنامج</th><th>السداد</th><th>الملف</th></tr></thead>
<tbody id="rows"></tbody></table></div>
</section>
</div>

<section id="profile" class="panel hide"></section>
</main>
<div id="badgePrint" class="print-only"></div>

<script>
const U='https://ymjkzvdjpuuxkcgkmbtc.supabase.co';
const K='sb_publishable_PIYJ3bv6D5gWl3nXyot3Qg__gZKtexJ';
const db=window.supabase.createClient(U,K);
const $=id=>document.getElementById(id);
let P=[],B=[],PR=[],I=[];

function msg(id,text,error=false){const e=$(id);if(e){e.className='msg'+(error?' err':'');e.textContent=text||''}}
function money(n){return Number(n||0).toLocaleString('ar-IQ')+' د.ع'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function badge(s){return '<span class="badge '+(['paid','صادرة','مدفوع'].includes(String(s||''))?'ok':'')+'">'+esc(s||'قيد الإجراء')+'</span>'}

async function isAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return null;
 const {data,error}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();
 return error||!data?null:user;
}
async function login(){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password)return msg('loginMsg','أدخل البريد الإلكتروني وكلمة المرور.',true);
 $('loginBtn').disabled=true;msg('loginMsg','جاري التحقق...');
 try{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)throw error;
  const u=await isAdmin();
  if(!u){await db.auth.signOut();throw Error('هذا الحساب غير مخول للإدارة.')}
  $('login').classList.add('hide');$('app').classList.remove('hide');await load();
 }catch(e){msg('loginMsg',e.message||'تعذر تسجيل الدخول.',true)}
 finally{$('loginBtn').disabled=false}
}
$('loginBtn').onclick=login;
$('password').onkeydown=e=>{if(e.key==='Enter')login()};
$('email').onkeydown=e=>{if(e.key==='Enter')login()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('paymentType').onchange=()=>{const i=$('paymentType').value==='installment';$('dueWrap').style.display=i?'block':'none';$('scheduleWrap').classList.toggle('hide',!i);if(i)buildSchedule()};
$('paymentType').onchange();


function buildSchedule(){
 const count=Number($('installmentCount').value||1);
 const total=Number((PR.find(x=>x.id===$('program').value)||{}).price||0);
 const initial=Math.min(Math.max(Number($('initial').value||0),0),total);
 const balance=Math.max(total-initial,0);
 if($('paymentType').value!=='installment'||balance<=0){$('scheduleWrap').classList.add('hide');return;}
 $('scheduleWrap').classList.remove('hide');
 const base=Math.floor((balance/count)*100)/100;
 let rem=balance;
 let rows='';
 for(let i=1;i<=count;i++){
   const amount=i===count?rem:base; rem-=amount;
   rows+='<div class="cols" style="margin-bottom:8px"><div><label>القسط '+i+'</label><input class="instAmount" data-n="'+i+'" type="number" min="0" value="'+amount.toFixed(2)+'"></div><div><label>تاريخ الاستحقاق</label><input class="instDate" data-n="'+i+'" type="date"></div></div>';
 }
 $('schedule').innerHTML=rows;
}
$('installmentCount').onchange=buildSchedule;
$('program').onchange=()=>{if($('paymentType').value==='installment')buildSchedule()};
$('initial').oninput=()=>{if($('paymentType').value==='installment')buildSchedule()};

async function load(){
 const [a,b,c,i]=await Promise.all([
  db.from('pilgrims').select('*').order('created_at',{ascending:false}),
  db.from('bookings').select('*').order('created_at',{ascending:false}),
  db.from('programs').select('*').order('departure_date'),
  db.from('installment_plans').select('*').order('due_date')
 ]);
 const er=[a,b,c,i].find(x=>x.error);
 if(er)return msg('listMsg',er.error.message,true);
 P=a.data||[];B=b.data||[];PR=c.data||[];I=i.data||[];
 $('pc').textContent=P.length;$('bc').textContent=B.length;
 $('paid').textContent=money(B.reduce((s,x)=>s+Number(x.paid_amount||0),0));
 $('rem').textContent=money(B.reduce((s,x)=>s+Number(x.remaining_amount||0),0));
 $('program').innerHTML='<option value="">اختر البرنامج</option>'+PR.filter(x=>x.status==='published').map(x=>'<option value="'+x.id+'">'+esc(x.title)+' — '+money(x.price)+'</option>').join('');
 $('badgeProgram').innerHTML='<option value="">اختر الرحلة لطباعة الباجات</option>'+PR.filter(x=>x.status==='published').map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('');
 render();
}

function render(){
 const q=$('search').value.trim().toLowerCase();
 $('rows').innerHTML=P.filter(x=>[x.full_name,x.phone,x.passport_number,x.profile_code].some(v=>String(v||'').toLowerCase().includes(q))).map(x=>{
  const b=B.find(z=>z.id===x.booking_id),pr=PR.find(z=>z.id===b?.program_id);
  return '<tr><td><b>'+esc(x.full_name)+'</b><br><small>'+esc(x.profile_code)+'</small></td><td>'+esc(x.phone||'—')+'</td><td>'+esc(x.passport_number||'—')+'</td><td>'+badge(x.visa_status)+'</td><td>'+esc(pr?.title||'—')+'</td><td>'+money(b?.paid_amount)+' / '+money(b?.remaining_amount)+'</td><td><button class="btn p" onclick="openProfile(\''+x.id+'\')">فتح</button></td></tr>'
 }).join('')||'<tr><td colspan="7">لا يوجد معتمرون.</td></tr>';
}
$('search').oninput=render;
$('photo').onchange=()=>{const f=$('photo').files?.[0];const im=$('photoPreview');if(!f){im.classList.add('hide');im.removeAttribute('src');return}im.src=URL.createObjectURL(f);im.classList.remove('hide')};

async function photoUrl(path){
 if(!path)return '';
 const r=await db.storage.from('pilgrim-photos').createSignedUrl(path,3600);
 return r.data?.signedUrl||'';
}
function qrUrl(text){return 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=2&data='+encodeURIComponent(text)}
async function badgeData(p,b,pr){
 const img=await photoUrl(p.photo_path);
 return {name:p.full_name||'—',photo:img,profile:p.profile_code||'—',booking:b?.booking_number||b?.id?.slice(0,8)||'—',trip:pr?.title||'—',city:pr?.city||'—',makkah:pr?.makkah_hotel||pr?.makkahHotel||'—',medina:pr?.city_hotel||pr?.medina_hotel||pr?.medinaHotel||'—',travel:pr?.travel_type||'—',qr:qrUrl('QH|'+(p.profile_code||p.id)+'|'+(b?.id||''))};
}
function badgeHtml(d){return '<article class="print-badge"><div class="btop"><div><div class="logo-text">قوافل الحرمين</div><div class="sub">للحج والعمرة</div></div><div class="sub">بطاقة معتمر</div></div><div class="body"><img class="photo" src="'+(d.photo||'')+'" onerror="this.style.visibility=\'hidden\'"><div><div class="name">'+esc(d.name)+'</div><div class="line"><b>الرحلة:</b> '+esc(d.trip)+'</div><div class="line"><b>المدينة:</b> '+esc(d.medina)+'</div><div class="line"><b>مكة:</b> '+esc(d.makkah)+'</div><div class="line"><b>السفر:</b> '+esc(d.travel)+'</div><div class="line"><b>الحجز:</b> '+esc(d.booking)+'</div></div><img class="qr" src="'+d.qr+'"></div><div class="foot"><span>ملف: '+esc(d.profile)+'</span><span>0778 007 7122 · 0781 479 9623</span></div></article>'}
async function printBadges(list,title){
 if(!list.length)return alert('لا توجد بيانات لهذه الرحلة.');
 // Open the print window immediately from the user's click. This is more reliable on iPhone/iPad than window.print() after async work.
 const w=window.open('about:blank','_blank');
 if(!w){return alert('المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة ثم اضغط طباعة الباج مرة أخرى.');}
 w.document.open();
 w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>باجات — '+esc(title||'قوافل الحرمين')+'</title><style>'+badgePrintCSS()+'</style></head><body><div id="printArea" class="badge-grid"><div style="padding:20px;text-align:center;font-family:Tahoma,Arial">جاري تجهيز الباجات…</div></div></body></html>');
 w.document.close();
 const cards=[];
 for(const x of list){const b=B.find(z=>z.id===x.booking_id),pr=PR.find(z=>z.id===b?.program_id);cards.push(badgeHtml(await badgeData(x,b,pr)))}
 const area=w.document.getElementById('printArea');
 if(area) area.innerHTML=cards.join('');
 // Wait for remote QR/images before opening the print dialog.
 const imgs=Array.from(w.document.images);
 await Promise.all(imgs.map(img=>new Promise(resolve=>{if(img.complete)return resolve();img.onload=img.onerror=resolve;})));
 setTimeout(()=>{w.focus();w.print();},250);
}
function badgePrintCSS(){return `
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Tahoma,Arial}.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm;padding:8mm}.print-badge{width:90mm;height:60mm;border:1px solid #d8dde2;border-radius:4mm;background:#fff;position:relative;overflow:hidden;padding:5mm;box-shadow:none;page-break-inside:avoid}.print-badge .btop{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9bd75;padding-bottom:2.5mm;margin-bottom:2.5mm}.print-badge .logo-text{font-weight:900;color:#0c3b63;font-size:4mm}.print-badge .sub{font-size:2.2mm;color:#8b6b25;margin-top:1mm}.print-badge .body{display:grid;grid-template-columns:25mm 1fr 17mm;gap:3mm;align-items:center}.print-badge .photo{width:25mm;height:31mm;border-radius:2mm;object-fit:cover;border:1px solid #ccd7df}.print-badge .name{font-weight:900;font-size:4.2mm;color:#072b49;margin-bottom:2mm}.print-badge .line{font-size:2.6mm;margin:1.2mm 0;color:#36566a}.print-badge .line b{color:#0c3b63}.print-badge .qr{width:17mm;height:17mm}.print-badge .foot{position:absolute;bottom:0;right:0;left:0;background:#072b49;color:#fff;font-size:2.3mm;padding:2mm 4mm;display:flex;justify-content:space-between}@page{size:A4;margin:0}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.badge-grid{padding:8mm}}
`}
$('printTripBadges').onclick=async()=>{const id=$('badgeProgram').value;if(!id)return alert('اختر الرحلة أولًا.');const list=P.filter(x=>{const b=B.find(z=>z.id===x.booking_id);return b?.program_id===id});const pr=PR.find(x=>x.id===id);await printBadges(list,pr?.title)};
async function openProfile(id){
 const p=P.find(x=>x.id===id);if(!p)return;
 const b=B.find(x=>x.id===p.booking_id),pr=PR.find(x=>x.id===b?.program_id),ins=I.filter(x=>x.booking_id===b?.id);
 $('profile').classList.remove('hide');
 $('profile').innerHTML='<h2>ملف المعتمر: '+esc(p.full_name)+'</h2>'+
 '<div class="cols"><div>رمز الملف<br><b>'+esc(p.profile_code||'—')+'</b></div><div>الهاتف<br>'+esc(p.phone||'—')+'</div><div>الجنسية<br>'+esc(p.nationality||'—')+'</div><div>الجواز<br>'+esc(p.passport_number||'—')+'</div><div>انتهاء الجواز<br>'+esc(p.passport_expiry||'—')+'</div><div>الفيزا<br>'+badge(p.visa_status)+' '+esc(p.visa_number||'')+'</div></div>'+
 '<div class="section"><h3>الرحلة والحساب</h3><div class="cols"><div>البرنامج<br><b>'+esc(pr?.title||'—')+'</b></div><div>نوع البرنامج<br><b>'+(b?.payment_type==='installment'?'قسط':'نقد')+'</b></div><div>الإجمالي<br><span class="money">'+money(b?.total_amount)+'</span></div><div>المدفوع<br><span class="money">'+money(b?.paid_amount)+'</span></div><div>المتبقي<br><span class="money">'+money(b?.remaining_amount)+'</span></div><div>الحالة<br>'+badge(b?.status)+'</div></div></div>'+
 (b?.payment_type==='installment'?'<div class="section"><h3>الأقساط</h3><div class="table"><table><thead><tr><th>القسط</th><th>الاستحقاق</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>'+((ins.length?ins.map(x=>'<tr><td>'+esc(x.installment_number)+'</td><td>'+esc(x.due_date||'—')+'</td><td>'+money(x.amount)+'</td><td>'+money(x.paid_amount)+'</td><td>'+badge(x.status)+'</td></tr>').join(''):'<tr><td colspan="5">لا توجد أقساط.</td></tr>'))+'</tbody></table></div><button id="manageBtn" class="btn p noPrint">💰 إدارة الدفعات والأقساط</button><div id="manager" class="section hide"></div></div>':'<div class="section"><span class="badge ok">برنامج نقدي — لا توجد أقساط</span></div>')+
 '<div class="section"><button class="btn w noPrint" onclick="window.print()">طباعة الملف</button> <button class="btn p noPrint" id="printOneBadge">🎫 طباعة الباج</button></div>';
 if(b?.payment_type==='installment')$('manageBtn').onclick=()=>managePayments(b);
 $('printOneBadge').onclick=()=>printBadges([p],pr?.title);
 $('profile').scrollIntoView({behavior:'smooth'});
}

async function managePayments(b){
 const box=$('manager');box.classList.remove('hide');box.innerHTML='<h4>إدارة الدفعات</h4><div id="pm"></div><div class="cols"><div><label>مبلغ الدفعة</label><input id="payAmount" type="number" min="1"></div><div><label>تاريخ الدفع</label><input id="payDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label>طريقة الدفع</label><input id="payMethod" value="نقد"></div><div><label>ملاحظات</label><input id="payNotes"></div></div><button id="savePay" class="btn p noPrint">تسجيل الدفعة</button>';
 const r=await db.from('installment_plans').select('*').eq('booking_id',b.id).order('installment_number');
 $('pm').innerHTML=r.error?'<div class="msg err">'+esc(r.error.message)+'</div>':(r.data?.length?'<div class="table"><table><thead><tr><th>القسط</th><th>الاستحقاق</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+x.installment_number+'</td><td>'+esc(x.due_date||'—')+'</td><td>'+money(x.amount)+'</td><td>'+money(x.paid_amount)+'</td><td>'+badge(x.status)+'</td></tr>').join('')+'</tbody></table></div>':'لا توجد أقساط.');
 $('savePay').onclick=()=>savePayment(b);
}
async function savePayment(b){
 const amount=Number($('payAmount').value||0);if(amount<=0)return msg('pm','أدخل مبلغًا صحيحًا.',true);
 const fresh=await db.from('bookings').select('*').eq('id',b.id).single();if(fresh.error)return msg('pm',fresh.error.message,true);
 if(amount>Number(fresh.data.remaining_amount||0))return msg('pm','مبلغ الدفعة أكبر من المتبقي.',true);
 const pay=await db.from('payments').insert({booking_id:b.id,amount,payment_date:$('payDate').value,method:$('payMethod').value||'نقد',notes:$('payNotes').value||null});
 if(pay.error)return msg('pm',pay.error.message,true);
 const nb=Number(fresh.data.paid_amount||0)+amount;
 const up=await db.from('bookings').update({paid_amount:nb,status:nb>=Number(fresh.data.total_amount||0)?'paid':'pending'}).eq('id',b.id);
 if(up.error)return msg('pm',up.error.message,true);
 let left=amount;
 const ir=await db.from('installment_plans').select('*').eq('booking_id',b.id).order('installment_number');
 if(!ir.error)for(const x of ir.data||[]){
  const due=Math.max(Number(x.amount||0)-Number(x.paid_amount||0),0);if(left<=0)break;
  const add=Math.min(left,due);if(add){const np=Number(x.paid_amount||0)+add;await db.from('installment_plans').update({paid_amount:np,status:np>=Number(x.amount||0)?'paid':'partial'}).eq('id',x.id);left-=add}
 }
 await load();const np=P.find(x=>x.booking_id===b.id);if(np)openProfile(np.id);
}

$('form').onsubmit=async e=>{
 e.preventDefault();msg('formMsg','جاري الحفظ...');
 const pr=PR.find(x=>x.id===$('program').value);if(!pr)return msg('formMsg','اختر البرنامج أولًا.',true);
 const total=Number(pr.price||0),paymentType=$('paymentType').value,paid=Math.min(Math.max(Number($('initial').value||0),0),total);
 const remaining=total-paid;
 try{
  const booking={program_id:pr.id,full_name:$('name').value.trim(),phone:$('phone').value.trim()||'',passengers_count:1,total_amount:total,paid_amount:paid,status:remaining?'pending':'paid',notes:'حجز من إدارة المعتمرين',payment_type:paymentType};
  let photoPath=null; const photoFile=$('photo').files?.[0]; if(photoFile){const ext=(photoFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg'; photoPath='pilgrim-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext; const upPhoto=await db.storage.from('pilgrim-photos').upload(photoPath,photoFile,{upsert:false,contentType:photoFile.type||'image/jpeg'}); if(upPhoto.error)throw upPhoto.error;}
  const br=await db.from('bookings').insert(booking).select('id').single();if(br.error)throw br.error;
  const payload={booking_id:br.data.id,full_name:$('name').value.trim(),phone:$('phone').value.trim()||null,nationality:$('nat').value.trim()||'عراقي',passport_number:$('pass').value.trim()||null,passport_expiry:$('pex').value||null,visa_status:$('visa').value,visa_number:$('vnum').value.trim()||null,visa_issued_at:$('vdate').value||null,document_url:$('doc').value.trim()||null,photo_path:photoPath,notes:$('notes').value.trim()||null,profile_code:'QH-'+Date.now().toString().slice(-8)};
  const pp=await db.from('pilgrims').insert(payload).select('id,archive_id').single();if(pp.error){await db.from('bookings').delete().eq('id',br.data.id);throw pp.error}
  if(photoPath && pp.data?.[0]?.archive_id) await db.from('pilgrim_archive').update({photo_path:photoPath}).eq('id',pp.data[0].archive_id);
  if(paid>0)await db.from('payments').insert({booking_id:br.data.id,amount:paid,payment_date:new Date().toISOString().slice(0,10),method:'دفعة أولى',notes:'دفعة أولى'});
  if(paymentType==='installment'&&remaining>0){
   const amounts=[...document.querySelectorAll('.instAmount')].map(x=>Number(x.value||0));
   const dates=[...document.querySelectorAll('.instDate')].map(x=>x.value||null);
   if(amounts.length===0)throw Error('حدد جدول الأقساط أولًا.');
   const sum=amounts.reduce((a,b)=>a+b,0);
   if(Math.abs(sum-remaining)>0.01)throw Error('مجموع الأقساط يجب أن يساوي المتبقي: '+money(remaining));
   if(dates.some(x=>!x))throw Error('أدخل تاريخ استحقاق كل قسط.');
   const rows=amounts.map((amount,i)=>({booking_id:br.data.id,installment_number:i+1,due_date:dates[i],amount,paid_amount:0,status:'pending'}));
   const ir=await db.from('installment_plans').insert(rows);
   if(ir.error)throw ir.error;
  }
  msg('formMsg','تم إنشاء ملف المعتمر والحجز بنجاح ✅');e.target.reset();$('nat').value='عراقي';$('initial').value=0;$('paymentType').value='cash';$('paymentType').onchange();$('schedule').innerHTML='';$('photoPreview').classList.add('hide');$('photoPreview').removeAttribute('src');await load();
 }catch(err){msg('formMsg',err.message||'تعذر الحفظ.',true)}
};

(async()=>{try{const{data:{session}}=await db.auth.getSession();if(session&&await isAdmin()){$('login').classList.add('hide');$('app').classList.remove('hide');await load()}}catch(e){msg('loginMsg',e.message||'تعذر فحص الجلسة.',true)}})();
</script>
